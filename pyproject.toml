[project]
name = "voice-assistant"
version = "0.1.0"
description = "Local Russian voice assistant: Silero VAD + faster-whisper + LM Studio + Edge/Silero TTS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "edge-tts>=7.3.1",
    "faster-whisper>=1.1",
    "httpx>=0.27",
    "num2words>=0.5.13",
    "numpy>=1.26",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "sherpa-onnx>=2.0.0",
    "silero-vad>=5.1",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "torch>=2.4",
    "torchaudio>=2.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

# CPU-only torch: the CUDA build is ~3 GB and this machine has no NVIDIA GPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
